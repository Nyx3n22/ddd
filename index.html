<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ELENEM</title>
<style>
  :root{
    --ui-scale: 1;
    --bg:#0e0d0b;
    --parchment:#d9c9a3;
    --parchment-dark:#b9a67c;
    --ink:#2b2118;
    --wood:#3a2c1e;
    --wood-light:#5a452e;
    --gold:#d8b25c;
    --blood:#8e3527;
    --moss:#5c7040;
    --text:#e6dcc6;
    --dim:#a99a7d;
    --font-body:'EB Garamond','Georgia',serif;
    --font-head:'Cinzel','Georgia',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:var(--font-body);user-select:none;-webkit-user-select:none}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;background:#07070a;overflow:hidden}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    image-rendering:pixelated;background:#0b0a09;box-shadow:0 0 0 2px #1d1a15,0 0 60px rgba(0,0,0,.9)}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:calc(15px * var(--ui-scale))}
  #ui *{pointer-events:none}
  #ui .clickable, #ui button, #ui input, #ui select, #ui .panel{pointer-events:auto}

  /* ---------- generic panel ---------- */
  .panel{background:
      linear-gradient(180deg,rgba(58,44,30,.97),rgba(32,25,17,.98));
    border:2px solid #6a5334;box-shadow:0 0 0 2px #17120c, 0 12px 40px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,225,170,.12);color:var(--text)}
  .parchment{background:
      radial-gradient(120% 100% at 20% 0%,#e6d7b1 0%,#d6c49b 45%,#c2ad80 100%);
    color:var(--ink);border:2px solid #8a7348;box-shadow:0 0 0 2px #17120c,0 12px 40px rgba(0,0,0,.6)}
  h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;letter-spacing:.06em}
  button{font-family:var(--font-head);letter-spacing:.05em;cursor:pointer;
    background:linear-gradient(180deg,#5b452c,#3a2b1b);color:#e9dcc0;border:2px solid #7b6139;
    padding:.35em .8em;font-size:.85em;text-transform:uppercase}
  button:hover:not(:disabled){background:linear-gradient(180deg,#75593a,#4a3620);border-color:var(--gold);color:#fff3d6}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.danger{border-color:#7d3a2c;background:linear-gradient(180deg,#5e2b21,#3a1a13)}
  .key{display:inline-block;min-width:1.5em;text-align:center;padding:0 .35em;
    border:2px solid #7b6139;background:#241b11;color:var(--gold);font-family:var(--font-head);font-size:.8em}

  /* ---------- HUD ---------- */
  #hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:calc(6px * var(--ui-scale));gap:8px}
  .hud-box{background:rgba(14,11,8,.72);border:2px solid #4a3a24;padding:.25em .55em;
    font-size:.82em;line-height:1.35;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
  .hud-box b{font-family:var(--font-head);color:var(--gold);letter-spacing:.04em}
  #hud-debt.urgent{border-color:var(--blood);animation:throb 1.6s infinite}
  @keyframes throb{0%,100%{box-shadow:inset 0 0 12px rgba(0,0,0,.6)}50%{box-shadow:inset 0 0 18px rgba(190,60,40,.55)}}
  #hud-left{display:flex;flex-direction:column;gap:4px}
  #hud-right{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

  #vitals{position:absolute;left:calc(8px * var(--ui-scale));bottom:calc(8px * var(--ui-scale));width:calc(210px * var(--ui-scale))}
  .vital{display:flex;align-items:center;gap:5px;margin-bottom:3px}
  .vital .lbl{font-size:.62em;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);width:5.4em;
    text-shadow:0 1px 2px #000}
  .track{flex:1;height:calc(8px * var(--ui-scale));background:#100d09;border:2px solid #4a3a24;position:relative;overflow:hidden}
  .fill{position:absolute;inset:0;width:50%;transition:width .18s linear}
  .fill.hp{background:linear-gradient(180deg,#c04a34,#7b2417)}
  .fill.st{background:linear-gradient(180deg,#c8b25e,#7d6a24)}
  .fill.hu{background:linear-gradient(180deg,#b07a45,#6b4522)}
  .fill.th{background:linear-gradient(180deg,#5b93bf,#2f5a80)}
  .fill.fa{background:linear-gradient(180deg,#7a7a92,#41415a)}
  .fill.hy{background:linear-gradient(180deg,#8a9a7a,#4d5a41)}
  .track.low .fill{animation:throb 1s infinite}

  #hud-belt{position:absolute;bottom:calc(8px * var(--ui-scale));left:50%;transform:translateX(-50%);
    display:flex;gap:4px}
  .belt-slot{width:calc(38px * var(--ui-scale));height:calc(38px * var(--ui-scale));
    background:rgba(14,11,8,.78);border:2px solid #4a3a24;position:relative;
    display:flex;align-items:center;justify-content:center}
  .belt-slot.sel{border-color:var(--gold);box-shadow:0 0 10px rgba(216,178,92,.5)}
  .belt-slot .k{position:absolute;top:-1px;left:2px;font-size:.55em;color:var(--dim);font-family:var(--font-head)}
  .belt-slot canvas{width:80%;height:80%}

  #prompt{position:absolute;left:50%;bottom:calc(64px * var(--ui-scale));transform:translateX(-50%);
    background:rgba(12,10,7,.86);border:2px solid #6a5334;padding:.3em .7em;font-size:.86em;
    text-align:center;max-width:80vw;box-shadow:0 6px 20px rgba(0,0,0,.6)}
  #prompt .sub{color:var(--dim);font-size:.82em;margin-top:.15em}

  #place{position:absolute;right:calc(8px * var(--ui-scale));bottom:calc(8px * var(--ui-scale));text-align:right}
  #clock-dial{position:absolute;right:calc(8px * var(--ui-scale));top:calc(52px * var(--ui-scale))}

  #toasts{position:absolute;top:calc(56px * var(--ui-scale));left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:4px;align-items:center;width:min(560px,90vw)}
  .toast{background:rgba(14,11,8,.9);border-left:3px solid var(--gold);border-top:1px solid #4a3a24;
    border-right:1px solid #4a3a24;border-bottom:1px solid #4a3a24;padding:.3em .7em;font-size:.82em;
    animation:tin .25s ease-out;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .toast.good{border-left-color:var(--moss)} .toast.bad{border-left-color:var(--blood)}
  .toast.warn{border-left-color:#c58a2e}
  @keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  #subtitle{position:absolute;left:50%;bottom:calc(112px * var(--ui-scale));transform:translateX(-50%);
    max-width:70vw;text-align:center;font-size:.9em;padding:.2em .5em}
  #subtitle.bg{background:rgba(8,7,5,.8)}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;background:rgba(6,5,4,.82);display:none;
    align-items:center;justify-content:center;padding:2vh 2vw;z-index:30;pointer-events:auto}
  .overlay.open{display:flex}
  .ov-body{width:min(1080px,96vw);max-height:94vh;display:flex;flex-direction:column}
  .ov-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:.5em .8em;border-bottom:2px solid #6a5334}
  .ov-head h2{font-size:1.05em;color:var(--gold)}
  .ov-head .hint{color:var(--dim);font-size:.75em}
  .ov-scroll{overflow:auto;padding:.8em}
  .tabs{display:flex;gap:4px;padding:.4em .8em 0}
  .tab{padding:.3em .8em;border:2px solid #4a3a24;border-bottom:none;background:#241b11;
    font-family:var(--font-head);font-size:.75em;color:var(--dim);cursor:pointer;text-transform:uppercase}
  .tab.on{background:#3d2e1c;color:var(--gold);border-color:#6a5334}

  /* dialog */
  #dialog{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);width:min(820px,94vw);
    display:none;z-index:25}
  #dialog.open{display:flex}
  #dlg-portrait{flex:0 0 auto;padding:8px;border-right:2px solid #6a5334;background:rgba(10,8,6,.6)}
  #dlg-portrait canvas{width:calc(96px * var(--ui-scale));height:calc(96px * var(--ui-scale));
    image-rendering:pixelated;border:2px solid #6a5334;background:#1b150e}
  #dlg-main{flex:1;padding:.6em .8em;min-width:0}
  #dlg-who{font-family:var(--font-head);color:var(--gold);font-size:.9em;margin-bottom:.15em}
  #dlg-who .role{color:var(--dim);font-size:.8em;font-family:var(--font-body)}
  #dlg-text{font-size:.95em;line-height:1.45;margin-bottom:.5em;min-height:2.6em}
  #dlg-opts{display:flex;flex-direction:column;gap:3px}
  .opt{text-align:left;background:rgba(20,15,10,.6);border:2px solid #453520;color:var(--text);
    padding:.3em .6em;font-family:var(--font-body);font-size:.88em;text-transform:none;letter-spacing:0}
  .opt:hover:not(:disabled){border-color:var(--gold);background:rgba(60,45,26,.75)}
  .opt .req{color:#c58a2e;font-size:.85em}
  .opt.locked{color:#8b7f68;border-style:dashed}
  .opt.locked .req{color:#9a6a5a}

  /* lists/cards used by notes, inventory, journal */
  .grid{display:grid;gap:6px}
  .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:rgba(0,0,0,.3);border:2px solid #4a3a24;padding:.5em .6em;font-size:.82em}
  .card h4{color:var(--gold);font-size:.95em;margin-bottom:.25em}
  .card .mut{color:var(--dim);font-size:.9em}
  .card.on{border-color:var(--gold)}
  .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:.22em 0;
    border-bottom:1px dashed rgba(255,255,255,.09);font-size:.84em}
  .row:last-child{border-bottom:none}
  .row .n{color:var(--dim)}
  .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(58px * var(--ui-scale)),1fr));gap:5px}
  .slot{aspect-ratio:1;background:rgba(0,0,0,.42);border:2px solid #453520;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .slot:hover{border-color:var(--gold)}
  .slot canvas{width:70%;height:70%;image-rendering:pixelated}
  .slot .q{position:absolute;right:2px;bottom:0;font-size:.62em;color:var(--dim)}
  .slot .w{position:absolute;left:2px;top:0;font-size:.58em;color:#8d7c5e}
  .slot.equip{border-color:var(--moss)}
  .bar-h{height:6px;background:#100d09;border:1px solid #4a3a24;position:relative;overflow:hidden;margin-top:3px}
  .bar-h i{position:absolute;inset:0;background:var(--moss);width:0%}

  #map-wrap{position:relative;flex:1;min-height:0;display:flex}
  #map-canvas{width:100%;height:100%;image-rendering:pixelated;background:#c9b489}
  #map-side{width:calc(230px * var(--ui-scale));border-left:2px solid #6a5334;padding:.6em;
    overflow:auto;background:rgba(0,0,0,.25)}

  /* radial quickbelt */
  #radial{position:fixed;inset:0;display:none;z-index:24}
  #radial.open{display:block}
  #radial canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated}

  /* dev console */
  #console{position:fixed;left:0;right:0;bottom:0;height:34vh;background:rgba(6,6,8,.95);
    border-top:2px solid #4a3a24;display:none;flex-direction:column;z-index:40;font-family:ui-monospace,Menlo,Consolas,monospace}
  #console.open{display:flex}
  #con-log{flex:1;overflow:auto;padding:.4em .6em;font-size:.78em;color:#b9c6a6;white-space:pre-wrap}
  #con-in{display:flex;border-top:1px solid #333;background:#0b0b0d}
  #con-in span{padding:.4em;color:#7f8f6a}
  #con-in input{flex:1;background:transparent;border:none;color:#d8e6c8;font-family:inherit;
    font-size:.82em;padding:.4em 0;outline:none}

  /* title / loading */
  #title{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#07060a;flex-direction:column;gap:14px}
  #title.hide{display:none}
  #title canvas{image-rendering:pixelated}
  #title .tt{font-family:var(--font-head);font-size:2.4em;color:var(--gold);letter-spacing:.35em;text-shadow:0 3px 0 #000}
  #title .sub{color:var(--dim);font-size:.9em;letter-spacing:.14em}
  #title .menu{display:flex;flex-direction:column;gap:6px;width:min(340px,80vw)}
  #title .menu button{width:100%;padding:.5em}
  #title .menu button.on{border-color:var(--gold);color:#fff3d6;background:linear-gradient(180deg,#75593a,#4a3620);box-shadow:0 0 10px rgba(216,178,92,.4)}
  #title .fine{color:#6d6350;font-size:.72em;max-width:min(560px,86vw);text-align:center;line-height:1.5}
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:45;transition:opacity .3s linear}

  #settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:.25em 0;
    border-bottom:1px dashed rgba(255,255,255,.08);font-size:.84em}
  .set-row label{color:var(--dim)}
  input[type=range]{width:130px;accent-color:var(--gold)}
  select{background:#241b11;color:var(--text);border:2px solid #4a3a24;padding:.2em .4em;font-family:var(--font-body)}
  .kbd-list{columns:2;font-size:.8em}
  .kbd-list .row{break-inside:avoid}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#1a140d}
  ::-webkit-scrollbar-thumb{background:#4a3a24;border:2px solid #1a140d}
  ::-webkit-scrollbar-thumb:hover{background:#6a5334}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage"><canvas id="game" width="640" height="360"></canvas></div>

<div id="ui">
  <div id="hud-top">
    <div id="hud-left">
      <div class="hud-box" id="hud-date"></div>
      <div class="hud-box" id="hud-debt"></div>
    </div>
    <div id="hud-right">
      <div class="hud-box" id="hud-gold"></div>
      <div class="hud-box" id="hud-weather"></div>
    </div>
  </div>

  <canvas id="clock-dial" width="44" height="44"></canvas>

  <div id="vitals">
    <div class="vital" data-v="hp"><span class="lbl"></span><span class="track"><i class="fill hp"></i></span></div>
    <div class="vital" data-v="st"><span class="lbl"></span><span class="track"><i class="fill st"></i></span></div>
    <div class="vital" data-v="hu"><span class="lbl"></span><span class="track"><i class="fill hu"></i></span></div>
    <div class="vital" data-v="th"><span class="lbl"></span><span class="track"><i class="fill th"></i></span></div>
    <div class="vital" data-v="fa"><span class="lbl"></span><span class="track"><i class="fill fa"></i></span></div>
    <div class="vital" data-v="hy"><span class="lbl"></span><span class="track"><i class="fill hy"></i></span></div>
  </div>

  <div id="hud-belt"></div>
  <div id="place"><div class="hud-box" id="hud-place"></div></div>
  <div id="prompt" style="display:none"></div>
  <div id="toasts"></div>
  <div id="subtitle" style="display:none"></div>
</div>

<div id="dialog" class="panel">
  <div id="dlg-portrait"><canvas id="dlg-face" width="48" height="48"></canvas></div>
  <div id="dlg-main">
    <div id="dlg-who">—</div>
    <div id="dlg-text"></div>
    <div id="dlg-opts"></div>
  </div>
</div>

<div id="radial"><canvas id="radial-canvas" width="260" height="260"></canvas></div>

<div id="ov-notes" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="notes-title"></h2><span class="hint" id="notes-hint"></span>
    <button class="close-x"><span class="key">K</span></button></div>
  <div class="tabs" id="notes-tabs"></div>
  <div class="ov-scroll" id="notes-body"></div>
</div></div>

<div id="ov-skills" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="skills-title"></h2><span class="hint" id="skills-hint"></span>
    <button class="close-x"><span class="key">G</span></button></div>
  <div class="ov-scroll" id="skills-body"></div>
</div></div>

<div id="ov-map" class="overlay"><div class="ov-body panel" style="height:min(640px,92vh)">
  <div class="ov-head"><h2 id="map-title"></h2><span class="hint" id="map-hint"></span>
    <button class="close-x"><span class="key">M</span></button></div>
  <div id="map-wrap"><canvas id="map-canvas" width="600" height="480"></canvas><div id="map-side"></div></div>
</div></div>

<div id="ov-inv" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="inv-title"></h2><span class="hint" id="inv-hint"></span>
    <button class="close-x"><span class="key">I</span></button></div>
  <div class="ov-scroll" id="inv-body"></div>
</div></div>

<div id="ov-journal" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="journal-title"></h2><span class="hint"></span>
    <button class="close-x"><span class="key">J</span></button></div>
  <div class="ov-scroll" id="journal-body"></div>
</div></div>

<div id="ov-trade" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="trade-title"></h2><span class="hint" id="trade-hint"></span>
    <button class="close-x"></button></div>
  <div class="ov-scroll" id="trade-body"></div>
</div></div>

<div id="ov-generic" class="overlay"><div class="ov-body panel">
  <div class="ov-head"><h2 id="gen-title">—</h2><span class="hint" id="gen-hint"></span>
    <button class="close-x"></button></div>
  <div class="ov-scroll" id="gen-body"></div>
</div></div>

<div id="ov-pause" class="overlay"><div class="ov-body panel" style="width:min(760px,94vw)">
  <div class="ov-head"><h2 id="pause-title"></h2><span class="hint" id="pause-hint"></span>
    <button class="close-x"><span class="key">ESC</span></button></div>
  <div class="tabs" id="pause-tabs"></div>
  <div class="ov-scroll" id="pause-body"></div>
</div></div>

<div id="console"><div id="con-log"></div><div id="con-in"><span>&gt;</span>
  <input id="con-input" autocomplete="off" spellcheck="false" placeholder=""></div></div></div>

<div id="fade"></div>

<div id="title">
  <canvas id="title-art" width="320" height="120"></canvas>
  <div class="tt"></div>
  <div class="sub"></div>
  <div class="menu" id="title-menu"></div>
  <div class="fine" id="title-fine"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
